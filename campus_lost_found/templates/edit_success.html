{% extends 'base.html' %}

{% block title %}修改成功{% endblock %}

{% block nav %}{% endblock %}

{% block content %}
<div class="success-page">
    <div class="success-icon">✅</div>
    <div class="success-title">修改成功</div>
    <div class="success-desc">
        信息状态已更新,其他同学现在会看到最新状态<br><br>
        <span style="color: #666;">{{ item.title }} · 已归还 · {{ item.item_type }}·{{ item.location }}</span>
    </div>
    <a href="{{ url_for('index') }}" class="btn-primary" style="margin: 0 auto 15px; width: 80%;">回到首页</a>
    <a href="{{ url_for('my_posts') }}" class="btn-secondary" style="margin: 0 auto; width: 80%;">返回我的发布</a>
</div>
{% endblock %}
