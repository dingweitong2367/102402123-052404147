{% extends 'base.html' %}

{% block title %}发布信息{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('publish') }}">
    <!-- 类型切换 -->
    <div class="tab-bar">
        <div class="tab-item active" onclick="selectType('寻物', this)">我丢了(寻物)</div>
        <div class="tab-item" onclick="selectType('招领', this)">我捡到(招领)</div>
    </div>
    <input type="hidden" name="item_type" id="item_type" value="寻物">

    <div class="form-card">
        <div class="form-item">
            <div class="form-label"><span class="required">*</span>物品名称</div>
            <input type="text" name="title" class="form-input" placeholder="例:校园卡/钥匙/雨伞" required>
        </div>
        
        <div class="form-item">
            <div class="form-label">物品分类</div>
            <div class="category-select" id="categorySelect">
                {% for cat in categories %}
                <div class="cat-option {% if loop.first %}active{% endif %}" onclick="selectCategory('{{ cat }}', this)">
                    {{ cat }}
                </div>
                {% endfor %}
            </div>
            <input type="hidden" name="category" id="category" value="{{ categories[0] }}">
        </div>
        
        <div class="form-item">
            <div class="form-label"><span class="required">*</span><span id="locationLabel">丢失地点/时间</span></div>
            <input type="text" name="location_time" id="locationInput" class="form-input" placeholder="例:图书馆三楼·今天上午" required>
        </div>
        
        <div class="form-item">
            <div class="form-label">补充描述</div>
            <textarea name="description" class="form-textarea" placeholder="物品的颜色、数量、特征等,方便辨认…"></textarea>
        </div>
        
        <div class="form-item">
            <div class="form-label"><span class="required">*</span>手机号</div>
            <input type="text" name="phone" class="form-input" placeholder="请输入你的手机号" required>
        </div>
        <div class="form-item">
            <div class="form-label">微信号</div>
            <input type="text" name="wechat" class="form-input" placeholder="请输入你的微信号">
        </div>
        <div class="form-item">
            <div class="form-label">QQ号</div>
            <input type="text" name="qq" class="form-input" placeholder="请输入你的QQ号">
        </div>
    </div>

    <button type="submit" class="btn-primary" style="border: none;">确认发布</button>
</form>

<script>
function selectType(type, el) {
    document.getElementById('item_type').value = type;
    document.querySelectorAll('.tab-item').forEach(item => item.classList.remove('active'));
    el.classList.add('active');

    // 动态切换地点标签和提示文字
    const label = document.getElementById('locationLabel');
    const input = document.getElementById('locationInput');
    if (type === '寻物') {
        label.innerText = '丢失地点/时间';
        input.placeholder = '例:图书馆三楼·今天上午';
    } else {
        label.innerText = '拾取地点/时间';
        input.placeholder = '例:运动场看台·今天下午';
    }
}

function selectCategory(cat, el) {
    document.getElementById('category').value = cat;
    document.querySelectorAll('.cat-option').forEach(item => item.classList.remove('active'));
    el.classList.add('active');
}
</script>
{% endblock %}
